name: Review visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: ./scripts/generate-secrets.sh
      - name: Capture disposable demo stack with the locked browser version
        env:
          PLAYWRIGHT_ARGS: --project=visual-regression --update-snapshots
        run: ./scripts/test-e2e-isolated.sh
      - name: Upload candidates for review without changing committed references
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: visual-baseline-candidates
          path: tests/e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7
