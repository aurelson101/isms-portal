name: Supply chain

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  image:
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build, attest and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/isms-portal-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/isms-portal-${{ matrix.name }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Export SPDX SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/isms-portal-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.39.0@sha256:6f13bb010923c33fb197047c8f88888e77071bd32596b3f605d62a133e493ce4 \
            "$IMAGE@$DIGEST" -o spdx-json > "sbom-${{ matrix.name }}.spdx.json"
      - name: Scan operating system and application packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/isms-portal-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload SBOM and vulnerability report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: supply-chain-${{ matrix.name }}
          path: |
            sbom-${{ matrix.name }}.spdx.json
            trivy-${{ matrix.name }}.sarif
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the immutable image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/isms-portal-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Enforce HIGH and CRITICAL vulnerability budget
        env:
          REPORT: trivy-${{ matrix.name }}.sarif
        run: |
          count=$(jq '[.runs[].results[]] | length' "$REPORT")
          test "$count" -eq 0 || {
            printf '%s\n' "$count HIGH or CRITICAL fixed vulnerabilities detected." >&2
            exit 1
          }
