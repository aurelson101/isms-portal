name: CI

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      e2e_scope:
        description: Browser tests to diagnose
        type: choice
        default: all
        options: [all, portal]
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  docker-smoke:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: ./scripts/generate-secrets.sh
      - run: ./scripts/test-e2e-isolated.sh
        timeout-minutes: 15
        env:
          PLAYWRIGHT_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_scope == 'portal' && 'portal.spec.ts --project=functional --no-deps' || '' }}
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  performance:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/generate-secrets.sh
      - run: ./scripts/test-performance-functional.sh
