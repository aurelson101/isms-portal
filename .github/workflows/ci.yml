name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  docker-smoke:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: ./scripts/generate-secrets.sh
      - run: ./scripts/test-e2e-isolated.sh

  performance:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/generate-secrets.sh
      - run: ./scripts/test-performance-functional.sh
