name: isms-portal
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"
services:
  reverse-proxy:
    logging: *bounded-logging
    image: isms-portal/nginx-secure:1.30.6
    build: { context: ., dockerfile: deploy/images/nginx.Dockerfile }
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [edge, app]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M, pids: 128 }
        reservations: { memory: 64M }

  frontend:
    logging: *bounded-logging
    init: true
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 768M, pids: 256 }
        reservations: { memory: 128M }

  api:
    logging: *bounded-logging
    init: true
    stop_grace_period: 150s
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file:
      - path: .env.app
        required: false
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    environment:
      DOCUMENT_STORAGE_PATH: /data/documents
    volumes: [document-storage:/data/documents]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [app, data, directory-egress, observability]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 1G, pids: 256 }
        reservations: { memory: 256M }

  worker:
    logging: *bounded-logging
    init: true
    stop_grace_period: 150s
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file:
      - path: .env.app
        required: false
    depends_on:
      api: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    environment:
      DOCUMENT_STORAGE_PATH: /data/documents
    volumes: [document-storage:/data/documents]
    healthcheck:
      test: ["CMD", "node", "dist/worker-health.js"]
      start_period: 45s
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [data, directory-egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 1G, pids: 256 }
        reservations: { memory: 256M }

  postgres:
    logging: *bounded-logging
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    image: isms-portal/postgres-secure:17.11
    build: { context: ., dockerfile: deploy/images/postgres.Dockerfile }
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isms}
      POSTGRES_USER: ${POSTGRES_USER:-isms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2G, pids: 256 }
        reservations: { memory: 512M }

  redis:
    logging: *bounded-logging
    read_only: true
    tmpfs: [/tmp]
    image: isms-portal/redis-secure:7.4.11
    build: { context: ., dockerfile: deploy/images/redis.Dockerfile }
    restart: unless-stopped
    env_file:
      - path: .env.redis
        required: false
    command:
      [
        "sh",
        "-c",
        'test -n "$${REDIS_PASSWORD}" || exit 1; exec docker-entrypoint.sh redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy noeviction --requirepass "$${REDIS_PASSWORD}"',
      ]
    volumes: [redis-data:/data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$${REDIS_PASSWORD}" ping 2>/dev/null | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M, pids: 128 }
        reservations: { memory: 64M }

  migrate:
    logging: *bounded-logging
    deploy:
      resources:
        limits: { pids: 256 }
    profiles: [maintenance]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file:
      - path: .env
        required: true
    command:
      [
        "sh",
        "-c",
        "node prisma/prepare-migrations.js && node node_modules/prisma/build/index.js migrate deploy --schema prisma/schema.prisma",
      ]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  storage-init:
    logging: *bounded-logging
    deploy:
      resources:
        limits: { pids: 64 }
    image: alpine:3.21
    command:
      [
        "sh",
        "-c",
        "mkdir -p /data/documents && chown -R 100:101 /data/documents && chmod 750 /data/documents",
      ]
    volumes: [document-storage:/data/documents]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]

  clamav:
    logging: *bounded-logging
    image: isms-portal/clamav-secure:1.4.6
    build: { context: ., dockerfile: deploy/images/clamav.Dockerfile }
    restart: unless-stopped
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks: [data, antivirus-egress]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2G, pids: 256 }
        reservations: { memory: 768M }

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
  directory-egress:
  antivirus-egress:
  observability:
volumes:
  postgres-data:
  redis-data:
  document-storage:
  clamav-data:
