name: isms-portal
services:
  reverse-proxy:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [edge, app]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { memory: 64M }

  frontend:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 768M }
        reservations: { memory: 128M }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file:
      - path: .env.app
        required: false
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    environment:
      DOCUMENT_STORAGE_PATH: /data/documents
    volumes: [document-storage:/data/documents]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [app, data, directory-egress, observability]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 1G }
        reservations: { memory: 256M }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file:
      - path: .env.app
        required: false
    depends_on:
      api: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    environment:
      DOCUMENT_STORAGE_PATH: /data/documents
    volumes: [document-storage:/data/documents]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [data, directory-egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 1G }
        reservations: { memory: 256M }

  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isms}
      POSTGRES_USER: ${POSTGRES_USER:-isms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2G }
        reservations: { memory: 512M }

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    env_file:
      - path: .env.redis
        required: false
    command: ["sh", "-c", "test -n \"$${REDIS_PASSWORD}\" || exit 1; exec docker-entrypoint.sh redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy noeviction --requirepass \"$${REDIS_PASSWORD}\""]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }
        reservations: { memory: 64M }

  migrate:
    profiles: [maintenance]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file:
      - path: .env
        required: true
    command: ["sh", "-c", "node prisma/prepare-migrations.js && node node_modules/prisma/build/index.js migrate deploy --schema prisma/schema.prisma"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  storage-init:
    image: alpine:3.21
    command:
      [
        "sh",
        "-c",
        "mkdir -p /data/documents && chown -R 100:101 /data/documents && chmod 750 /data/documents",
      ]
    volumes: [document-storage:/data/documents]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]

  clamav:
    image: clamav/clamav:1.4.6@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    restart: unless-stopped
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks: [data, antivirus-egress]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2G }
        reservations: { memory: 768M }

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
  directory-egress:
  antivirus-egress:
  observability:
volumes:
  postgres-data:
  redis-data:
  document-storage:
  clamav-data:
