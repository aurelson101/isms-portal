# Optional pilot only. Base and SSO deployments do not load this file.
services:
  api:
    environment:
      MIP_READER_ENABLED: ${MIP_READER_ENABLED:-false}
      MIP_READER_URL: http://mip-reader:8080
      MIP_API_KEY_FILE: /run/secrets/mip_api_key
    secrets: [mip_api_key]
    networks: [mip-private]

  mip-reader:
    profiles: [mip]
    build: { context: ., dockerfile: integrations/mip-reader/Dockerfile }
    restart: unless-stopped
    init: true
    environment:
      MIP_TENANT_ID: ${MIP_TENANT_ID:?MIP tenant required}
      MIP_CLIENT_ID: ${MIP_CLIENT_ID:?MIP client required}
      MIP_ALLOWED_DOMAINS: ${MIP_ALLOWED_DOMAINS:?MIP user domains required}
      MIP_API_KEY_FILE: /run/secrets/mip_api_key
      MIP_CERTIFICATE_PEM_FILE: /run/secrets/mip_certificate
      MIP_PRIVATE_KEY_PEM_FILE: /run/secrets/mip_private_key
    secrets: [mip_api_key, mip_certificate, mip_private_key]
    networks: [mip-private, mip-egress]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "4m", max-file: "1" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      start_period: 30s
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 768M, pids: 128 }

networks:
  mip-private: { internal: true }
  mip-egress: {}
secrets:
  mip_api_key:
    file: ${MIP_API_KEY_HOST_FILE:-./secrets/mip-api-key.txt}
  mip_certificate:
    file: ${MIP_CERTIFICATE_HOST_FILE:-./secrets/mip-certificate.pem}
  mip_private_key:
    file: ${MIP_PRIVATE_KEY_HOST_FILE:-./secrets/mip-private-key.pem}
