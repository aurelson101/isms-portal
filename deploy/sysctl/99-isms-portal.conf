# Required by Redis background persistence. Install on the Docker host.
vm.overcommit_memory = 1

# Small host (4 GiB): prefer page cache eviction over swapping PostgreSQL/Node.
vm.swappiness = 10
# Absorb connection bursts on the reverse proxy (somaxconn is already 4096).
net.ipv4.tcp_max_syn_backlog = 4096
