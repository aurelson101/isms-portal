events {}
http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  upstream web { server frontend:3000; }
  upstream api { server api:3001; }
  server {
    listen 8080;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      # Never trust identity headers supplied by an internet client. A production
      # SSO gateway must replace these empty values after authentication.
      proxy_set_header X-Auth-User "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_pass http://api/;
    }
    location / { proxy_set_header Host $host; proxy_pass http://web; }
  }
}
