events {}
http {
  # A page refresh fans out to several authenticated API endpoints in parallel.
  # Keep a sustainable per-IP limit while allowing that normal browser burst.
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  # Docker service IPs can change during a rolling rebuild. Keep the cache
  # short so the edge stops targeting a replaced container almost immediately.
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 2s;
  server {
    listen 8080;
    # Keep authentication redirects relative so an upstream TLS terminator
    # does not leak this container's internal http://host:8080 address.
    absolute_redirect off;
    set $api_backend http://api:3001;
    set $web_backend http://frontend:3000;
    client_max_body_size 50m;
    # The edge owns browser-facing security policies. Remove overlapping
    # upstream headers so clients receive one unambiguous policy.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'nonce-$request_id'; script-src 'self' 'nonce-$request_id'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    location ~ ^/api/auth/(login|directory-login)$ {
      limit_req zone=login burst=5 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Auth-User "";
      proxy_set_header X-Auth-Mail "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_set_header X-Auth-Session-Expires "";
      proxy_pass $api_backend;
    }
    # Document previews are embedded by the same-origin portal reader. Keep the
    # global anti-framing policy everywhere else and relax it only here.
    location ~ ^/api/documents/[^/]+/content$ {
      limit_req zone=api burst=300 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Auth-User "";
      proxy_set_header X-Auth-Mail "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_set_header X-Auth-Session-Expires "";
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy no-referrer always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self';" always;
      proxy_pass $api_backend;
    }
    # Prometheus scraping is performed on the private API network. Do not
    # expose implementation and activity metrics through the public portal.
    location = /api/metrics {
      return 404;
    }
    location /api/ {
      limit_req zone=api burst=300 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      # Never trust identity headers supplied by an internet client. A production
      # SSO gateway must replace these empty values after authentication.
      proxy_set_header X-Auth-User "";
      proxy_set_header X-Auth-Mail "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_set_header X-Auth-Session-Expires "";
      proxy_pass $api_backend;
    }
    location = /_admin_auth {
      internal;
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Auth-User "";
      proxy_set_header X-Auth-Mail "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_set_header X-Auth-Session-Expires "";
      proxy_pass $api_backend/admin/check;
    }
    location = /_portal_auth {
      internal;
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Auth-User "";
      proxy_set_header X-Auth-Mail "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_set_header X-Auth-Session-Expires "";
      proxy_pass $api_backend/me;
    }
    location = /admin/login {
      proxy_set_header Host $http_host;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter '<script' '<script nonce="$request_id"';
      sub_filter '<style' '<style nonce="$request_id"';
      proxy_pass $web_backend;
    }
    # The user login page must remain reachable without an authenticated
    # portal session; otherwise the auth_request fallback redirects it to
    # itself indefinitely.
    location = /login {
      proxy_set_header Host $http_host;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter '<script' '<script nonce="$request_id"';
      sub_filter '<style' '<style nonce="$request_id"';
      proxy_pass $web_backend;
    }
    location @admin_login_redirect {
      return 302 /admin/login?return=/admin;
    }
    location @portal_login_redirect {
      return 302 /login?return=$uri;
    }
    # Hashed Next.js assets are immutable and do not require nonce injection.
    # Compress them at the edge without enabling compression for sensitive API
    # responses.
    location ^~ /_next/static/ {
      proxy_set_header Host $http_host;
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_comp_level 5;
      gzip_types application/javascript text/css image/svg+xml;
      proxy_pass $web_backend;
    }
    location ^~ /admin {
      auth_request /_admin_auth;
      error_page 401 403 = @admin_login_redirect;
      proxy_set_header Host $http_host;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter '<script' '<script nonce="$request_id"';
      sub_filter '<style' '<style nonce="$request_id"';
      proxy_pass $web_backend;
    }
    location / {
      auth_request /_portal_auth;
      error_page 401 403 = @portal_login_redirect;
      proxy_set_header Host $http_host;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter '<script' '<script nonce="$request_id"';
      sub_filter '<style' '<style nonce="$request_id"';
      proxy_pass $web_backend;
    }
  }
}
