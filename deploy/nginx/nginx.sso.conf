events {}
http {
  map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
  }
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  # Docker service IPs can change during a rolling rebuild. Keep the cache
  # short so the edge stops targeting a replaced container almost immediately.
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 2s;

  server {
    listen 8080;
    set $api_backend http://api:3001;
    set $web_backend http://frontend:3000;
    set $oauth2_backend http://oauth2-proxy:4180;
    client_max_body_size 50m;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'nonce-$request_id'; script-src 'self' 'nonce-$request_id'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    location = /oauth2/auth {
      internal;
      proxy_pass $oauth2_backend;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URL $external_scheme://$http_host$request_uri;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    location /oauth2/ {
      proxy_pass $oauth2_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $external_scheme;
      proxy_set_header X-Auth-Request-Redirect $external_scheme://$http_host$request_uri;
    }

    location @oauth2_signin {
      return 302 /oauth2/start?rd=$external_scheme://$http_host$request_uri;
    }

    location = /_portal_session {
      internal;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Auth-Mail "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_set_header X-Auth-Session-Expires "";
      proxy_pass $api_backend/me;
    }

    location @portal_session_fallback {
      auth_request /_portal_session;
      error_page 401 403 = @oauth2_signin;
      proxy_set_header Host $host;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter '<script' '<script nonce="$request_id"';
      sub_filter '<style' '<style nonce="$request_id"';
      proxy_pass $web_backend;
    }

    location @api_session_fallback {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Auth-Mail "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_set_header X-Auth-Session-Expires "";
      proxy_pass $api_backend;
    }

    location @document_session_fallback {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Auth-Mail "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_set_header X-Auth-Session-Expires "";
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy no-referrer always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self';" always;
      proxy_pass $api_backend;
    }

    location ~ ^/api/auth/(login|directory-login)$ {
      limit_req zone=login burst=5 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Auth-Mail "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_set_header X-Auth-Session-Expires "";
      proxy_pass $api_backend;
    }

    location ^~ /api/admin {
      limit_req zone=api burst=100 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Auth-Mail "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_set_header X-Auth-Session-Expires "";
      proxy_pass $api_backend;
    }

    location ~ ^/api/documents/[^/]+/content$ {
      limit_req zone=api burst=100 nodelay;
      auth_request /oauth2/auth;
      error_page 401 403 = @document_session_fallback;
      auth_request_set $sso_email $upstream_http_x_auth_request_email;
      auth_request_set $sso_user $upstream_http_x_auth_request_user;
      auth_request_set $sso_groups $upstream_http_x_auth_request_groups;
      auth_request_set $sso_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $sso_cookie always;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Auth-Mail $sso_email;
      proxy_set_header X-Auth-Name $sso_user;
      proxy_set_header X-Auth-Groups $sso_groups;
      proxy_set_header X-Auth-Session-Expires "";
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy no-referrer always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self';" always;
      proxy_pass $api_backend;
    }

    location = /api/metrics {
      return 404;
    }

    location /api/ {
      limit_req zone=api burst=100 nodelay;
      auth_request /oauth2/auth;
      error_page 401 403 = @api_session_fallback;
      auth_request_set $sso_email $upstream_http_x_auth_request_email;
      auth_request_set $sso_user $upstream_http_x_auth_request_user;
      auth_request_set $sso_groups $upstream_http_x_auth_request_groups;
      auth_request_set $sso_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $sso_cookie always;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Auth-Mail $sso_email;
      proxy_set_header X-Auth-Name $sso_user;
      proxy_set_header X-Auth-Groups $sso_groups;
      proxy_set_header X-Auth-Session-Expires "";
      proxy_pass $api_backend;
    }

    location = /_admin_auth {
      internal;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Auth-Mail "";
      proxy_set_header X-Auth-Name "";
      proxy_set_header X-Auth-Groups "";
      proxy_set_header X-Auth-Session-Expires "";
      proxy_pass $api_backend/admin/check;
    }

    location = /admin/login {
      proxy_set_header Host $host;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter '<script' '<script nonce="$request_id"';
      sub_filter '<style' '<style nonce="$request_id"';
      proxy_pass $web_backend;
    }

    location @admin_login_redirect {
      return 302 /admin/login?return=/admin;
    }

    location ^~ /_next/static/ {
      proxy_set_header Host $host;
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_comp_level 5;
      gzip_types application/javascript text/css image/svg+xml;
      proxy_pass $web_backend;
    }

    location ^~ /admin {
      auth_request /_admin_auth;
      error_page 401 403 = @admin_login_redirect;
      proxy_set_header Host $host;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter '<script' '<script nonce="$request_id"';
      sub_filter '<style' '<style nonce="$request_id"';
      proxy_pass $web_backend;
    }

    location = /login {
      proxy_set_header Host $host;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter '<script' '<script nonce="$request_id"';
      sub_filter '<style' '<style nonce="$request_id"';
      proxy_pass $web_backend;
    }

    location / {
      auth_request /oauth2/auth;
      error_page 401 403 = @portal_session_fallback;
      auth_request_set $sso_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $sso_cookie always;
      proxy_set_header Host $host;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter '<script' '<script nonce="$request_id"';
      sub_filter '<style' '<style nonce="$request_id"';
      proxy_pass $web_backend;
    }
  }
}
