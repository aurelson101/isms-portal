# Apply with: docker compose -f docker-compose.yml -f deploy/compose/observability-syslog.yml up -d
# SYSLOG_ADDRESS must use a private collector, preferably tcp+tls://host:6514.
services:
  api:
    logging:
      driver: syslog
      options:
        syslog-address: "${SYSLOG_ADDRESS:?Set a private tcp+tls collector URI}"
        syslog-tls-ca-cert: "${SYSLOG_TLS_CA_CERT:?Set the Docker host CA file path}"
        syslog-tls-cert: "${SYSLOG_TLS_CERT:?Set the Docker host client certificate path}"
        syslog-tls-key: "${SYSLOG_TLS_KEY:?Set the Docker host private key path}"
        syslog-tls-skip-verify: "false"
        syslog-format: rfc5424micro
        tag: "isms-portal/api/{{.ID}}"
        cache-max-size: "20m"
        cache-max-file: "5"
  worker:
    logging:
      driver: syslog
      options:
        syslog-address: "${SYSLOG_ADDRESS:?Set a private tcp+tls collector URI}"
        syslog-tls-ca-cert: "${SYSLOG_TLS_CA_CERT:?Set the Docker host CA file path}"
        syslog-tls-cert: "${SYSLOG_TLS_CERT:?Set the Docker host client certificate path}"
        syslog-tls-key: "${SYSLOG_TLS_KEY:?Set the Docker host private key path}"
        syslog-tls-skip-verify: "false"
        syslog-format: rfc5424micro
        tag: "isms-portal/worker/{{.ID}}"
        cache-max-size: "20m"
        cache-max-file: "5"
  reverse-proxy:
    logging:
      driver: syslog
      options:
        syslog-address: "${SYSLOG_ADDRESS:?Set a private tcp+tls collector URI}"
        syslog-tls-ca-cert: "${SYSLOG_TLS_CA_CERT:?Set the Docker host CA file path}"
        syslog-tls-cert: "${SYSLOG_TLS_CERT:?Set the Docker host client certificate path}"
        syslog-tls-key: "${SYSLOG_TLS_KEY:?Set the Docker host private key path}"
        syslog-tls-skip-verify: "false"
        syslog-format: rfc5424micro
        tag: "isms-portal/reverse-proxy/{{.ID}}"
        cache-max-size: "20m"
        cache-max-file: "5"
